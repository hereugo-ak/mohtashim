services:
  - type: web
    name: amu-campaign-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
