# Keeps the repository "active" for GitHub Actions scheduling purposes.
# GitHub auto-disables scheduled workflows in repositories with no activity
# for 60 days, which would silently kill the keep-render-alive pinger. This
# workflow commits a small timestamp file weekly so that never happens.

name: Repository heartbeat

on:
  schedule:
    - cron: '3 9 * * 1' # Mondays 09:03 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-heartbeat
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the activity stamp
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > keep-alive.stamp
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "keep-alive-bot"
            git config user.email "actions@users.noreply.github.com"
            git add keep-alive.stamp
            git commit -m "chore: keep-alive heartbeat [skip ci]"
            git push
          else
            echo "Stamp unchanged; nothing to commit."
          fi
