# Uptime monitor for the campaign API path that visitors actually use:
# the same-origin Vercel function (which also proves the Supabase connection).
# Optionally also checks the Render standby API if RE_HEALTH is set.
#
# GitHub registers new cron schedules with a delay (often 30-60+ minutes after
# the first push) and individual runs can drift a few minutes. Treat this as a
# monitor with warning annotations, not as a precision pinger - the primary
# path (Vercel serverless) does not depend on it.
#
# Optional repository variables (Settings -> Secrets and variables -> Actions
# -> Variables): VERCEL_HEALTH_URL, RENDER_HEALTH_URL.

name: Campaign API uptime monitor

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the visitor request path (Vercel function + Supabase)
        env:
          HEALTH_URL: ${{ vars.VERCEL_HEALTH_URL }}
        run: |
          url="${HEALTH_URL:-https://mohtashimforcourtmember.vercel.app/api/health}"
          echo "Checking $url"
          for attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 60 "$url" 2>/dev/null || echo 000)"
            echo "attempt ${attempt}: HTTP ${code} $(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json 2>/dev/null; then
              echo "Primary API path is healthy."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error title=Campaign API down::${url} failed health check after 3 attempts."

      - name: Check Render standby (optional)
        if: ${{ vars.RENDER_HEALTH_URL != '' }}
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$RENDER_HEALTH_URL" 2>/dev/null || echo 000)"
          echo "Render standby: HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::notice title=Render standby not warm::${RENDER_HEALTH_URL} returned HTTP ${code} (acceptable if the site no longer points at Render)."
          fi
